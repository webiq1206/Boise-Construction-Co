name: Homepage responsive review
on:
  pull_request:
    branches: [main]
    paths:
      - components/approved/ApprovedHome.tsx
      - components/approved/HomeHero.tsx
      - components/approved/HeroBackgroundVideo.tsx
      - app/family-adoption.css
      - public/images/construction/boise-construction-co-*
      - tests/family-chrome.test.ts
      - scripts/verify-hero-video.cjs
      - scripts/verify-hero-fold.cjs
      - components/approved/HomePlanningSections.module.css
      - components/PlanningRangeExplorer.tsx
      - scripts/verify-homepage-responsive.cjs
      - .github/workflows/homepage-responsive.yml
      - scripts/branding-ci-evidence-bound.mjs
permissions:
  contents: read
concurrency:
  group: homepage-responsive-${{ github.ref }}
  cancel-in-progress: true
jobs:
  homepage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install locked dependencies without lifecycle hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Start isolated homepage preview
        run: |
          mkdir -p test-results/homepage-responsive
          node scripts/offline-run.mjs dev --hostname 127.0.0.1 --port 34863 > test-results/homepage-responsive/server.log 2>&1 &
          node <<'JS'
          const start = Date.now();
          (async () => {
            while (Date.now()-start < 180000) {
              try {
                const response = await fetch('http://127.0.0.1:34863/', {signal: AbortSignal.timeout(10000)});
                if (response.ok) process.exit(0);
              } catch {}
              await new Promise(resolve => setTimeout(resolve, 1000));
            }
            process.exit(1);
          })();
          JS
      - name: Capture responsive homepage and exercise local controls
        run: node scripts/verify-homepage-responsive.cjs
      - name: Verify measured hero fold and persistent UI states
        run: node scripts/verify-hero-fold.cjs
      - name: Bound hero fold evidence to64MiB
        id: hero_fold_evidence
        if: always()
        run: node scripts/branding-ci-evidence-bound.mjs --strict-64m 'test-results/hero-fold/*'
      - name: Upload hero fold geometry and screenshots
        if: ${{ always() && steps.hero_fold_evidence.outcome == 'success' && steps.hero_fold_evidence.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hero-fold-review-${{ github.sha }}
          path: branding-ci-evidence/complete.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Verify approved hero video, preferences and playback controls
        run: |
          node --import tsx --test tests/family-chrome.test.ts
          node scripts/verify-hero-video.cjs
      - name: Bound hero video evidence to 64MiB
        id: hero_video_evidence
        if: always()
        run: node scripts/branding-ci-evidence-bound.mjs --strict-64m 'test-results/hero-uniform-final/*'
      - name: Upload hero video browser evidence
        if: ${{ always() && steps.hero_video_evidence.outcome == 'success' && steps.hero_video_evidence.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: hero-uniform-overlay-review-${{ github.sha }}
          path: branding-ci-evidence/complete.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Bound complete artifact group 1 to64MiB
        id: bounded_artifact_01
        if: always()
        run: node scripts/branding-ci-evidence-bound.mjs --strict-64m 'test-results/homepage-responsive/*.json' 'test-results/homepage-responsive/*.log'
      - name: Upload metrics and server diagnostics
        if: ${{ always() && steps.bounded_artifact_01.outcome == 'success' && steps.bounded_artifact_01.outputs.ready == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: homepage-responsive-metrics-${{ github.sha }}
          path: branding-ci-evidence/complete.tar.gz
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Bound complete artifact group 2 to64MiB
        id: bounded_artifact_02
        if: always()
        run: node scripts/branding-ci-evidence-bound.mjs --strict-64m 'test-results/homepage-responsive/*-320x568.png' 'test-results/homepage-responsive/*-320x568.jpg'
      - name: Upload 320x568 review screenshots

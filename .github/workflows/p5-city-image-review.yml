name: P5 service and city imagery verification
on:
  push:
    branches: [codex/p5-visual-review-20260910]
    paths: [shared/cityServiceImages.ts, .github/workflows/p5-city-image-review.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: p5-city-images-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    container: mcr.microsoft.com/playwright:v1.60.0-noble
    env:
      P5_PARENT: "0"
      TZ: UTC
      SESSION_SECRET: p5-visual-review-ephemeral-session-key-20260910
      P5_SHARD: ${{ matrix.shard }}
      P5_SHARDS: 3
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --no-audit --no-fund
      - name: Production build and required repository gates
        run: npm run build
      - name: Start the production server
        run: |
          npx next start -p 5000 > /tmp/p5-review-server.log 2>&1 &
          node -e 'let n=0;const t=setInterval(async()=>{try{const r=await fetch("http://127.0.0.1:5000");if(r.ok){clearInterval(t);return}}catch{}if(++n>90){clearInterval(t);process.exit(1)}},1000)'
      - name: Select every affected city page
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const routes = JSON.parse(fs.readFileSync('scripts/p5-visual-routes.json', 'utf8'));
          const selected = routes.filter(route => new RegExp('^/services/(lot-evaluation|shop-homes-barndominiums)/[^/]+$').test(route));
          if (!selected.length) throw new Error('No affected city routes selected');
          fs.writeFileSync('scripts/p5-visual-routes.json', JSON.stringify(selected));
          console.log(selected.length + ' affected routes at nine widths');
          NODE
      - name: Capture every recorded public route at nine widths
        run: timeout 30m node scripts/p5-visual-review.mjs > /tmp/p5-review-summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p5-city-images-${{ matrix.shard }}
          path: |
            p5-visual-review
            /tmp/p5-review-server.log
            /tmp/p5-review-summary.json
          retention-days: 14
